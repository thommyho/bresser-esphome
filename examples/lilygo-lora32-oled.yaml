# LILYGO LoRa32 868 MHz (T3 V1.6.x) with SX1276 and 0.96 inch SSD1306 OLED.
# Shows the own station and the mean of all other stations on the display.
# Page images: docs/oled, description: README.md.

esphome:
  name: bresser-lilygo-oled
  friendly_name: Bresser LilyGO OLED

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ap:
    ssid: Bresser LilyGO Setup
    password: !secret fallback_ap_password

captive_portal:

improv_serial:


external_components:
  - source: github://thommyho/bresser-esphome@multi-station
    components: [bresser_weather]
    refresh: 0s

bresser_weather:
  radio_type: sx1276
  # Replace with the own station ID from entity "Empfangene Stationen".
  preferred_sensor_id: 0x00001234
  max_sensors: 8
  pins:
    sck: 5
    miso: 19
    mosi: 27
    cs: 18
    # Tested with 14. The LilyGO pin map of the T3 V1.6 lists 23.
    reset: 14
    irq: 26
    gpio: 33
  log_sensor_id: true

  temperature:
    id: outdoor_temperature
    name: Aussentemperatur
  humidity:
    id: outdoor_humidity
    name: Luftfeuchtigkeit
  wind_gust:
    id: outdoor_wind_gust
    name: Windboe
  wind_speed:
    id: outdoor_wind_speed
    name: Windgeschwindigkeit
  wind_direction:
    id: outdoor_wind_direction
    name: Windrichtung
  rain:
    id: outdoor_rain
    name: Regenmenge gesamt
  uv:
    id: outdoor_uv
    name: UV-Index
  illuminance:
    id: outdoor_illuminance
    name: Beleuchtungsstaerke
  rssi:
    id: outdoor_rssi
    name: Funksignal Wetterstation
    # The component publishes RSSI with every received packet.
    on_value:
      - lambda: id(last_packet_ms) = millis();
  battery_low:
    id: outdoor_battery_low
    name: Batterie Wetterstation schwach
  sensor_id:
    id: outdoor_sensor_id
    name: Sensor-ID
  stations:
    name: Empfangene Stationen

  neighbors:
    timeout: 15min
    temperature:
      id: neighbor_temperature
      name: Umgebung Temperatur
    humidity:
      id: neighbor_humidity
      name: Umgebung Luftfeuchtigkeit
    wind_gust:
      name: Umgebung Windboe
    wind_speed:
      id: neighbor_wind_speed
      name: Umgebung Windgeschwindigkeit
    wind_direction:
      name: Umgebung Windrichtung
    rain:
      name: Umgebung Regenmenge
    uv:
      name: Umgebung UV-Index
    illuminance:
      name: Umgebung Beleuchtungsstaerke
    station_count:
      id: neighbor_count
      name: Umgebung Stationen

sensor:
  - platform: template
    name: Abweichung Temperatur zur Umgebung
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
    lambda: return id(outdoor_temperature).state - id(neighbor_temperature).state;

  - platform: wifi_signal
    id: wlan_signal
    name: WLAN Signal
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: Laufzeit
    update_interval: 60s
    entity_category: diagnostic

button:
  - platform: restart
    name: Neustart
    entity_category: diagnostic

globals:
  - id: last_packet_ms
    type: uint32_t
    initial_value: "0"
  - id: oled_page
    type: uint8_t
    initial_value: "0"

i2c:
  sda: 21
  scl: 22

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 13
    glyphs: &oled_glyphs " !%&+-./0123456789:?ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°äöüÄÖÜß"
  - file: "gfonts://Roboto"
    id: font_big
    size: 24
    glyphs: *oled_glyphs

display:
  - platform: ssd1306_i2c
    id: oled
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: 1s
    lambda: |-
      static const char *const TITLES[] = {"Klima", "Wind", "Regen & Licht", "Umgebung", "Status"};
      const bool has_packet = id(last_packet_ms) != 0;

      // Print one label on the left and one formatted value on the right.
      auto row = [&](int y, const char *label, float value, const char *format) {
        it.print(0, y, id(font_small), label);
        if (std::isnan(value)) {
          it.print(127, y, id(font_small), TextAlign::TOP_RIGHT, "--");
        } else {
          it.printf(127, y, id(font_small), TextAlign::TOP_RIGHT, format, value);
        }
      };
      auto big = [&](float value, const char *format) {
        if (std::isnan(value)) {
          it.print(64, 16, id(font_big), TextAlign::TOP_CENTER, "--");
        } else {
          it.printf(64, 16, id(font_big), TextAlign::TOP_CENTER, format, value);
        }
      };

      // The header shows the age of the last own packet, so stale values are visible.
      it.print(0, 0, id(font_small), TITLES[id(oled_page)]);
      if (id(oled_page) == 3) {
        const float stations = id(neighbor_count).state;
        it.printf(127, 0, id(font_small), TextAlign::TOP_RIGHT, "%.0f Stat.", std::isnan(stations) ? 0.0f : stations);
      } else if (!has_packet) {
        it.print(127, 0, id(font_small), TextAlign::TOP_RIGHT, "--");
      } else {
        const uint32_t age = (millis() - id(last_packet_ms)) / 1000;
        if (age < 60) {
          it.printf(127, 0, id(font_small), TextAlign::TOP_RIGHT, "vor %us", (unsigned) age);
        } else if (age < 3600) {
          it.printf(127, 0, id(font_small), TextAlign::TOP_RIGHT, "vor %um", (unsigned) (age / 60));
        } else {
          it.printf(127, 0, id(font_small), TextAlign::TOP_RIGHT, "vor %uh", (unsigned) (age / 3600));
        }
      }
      it.horizontal_line(0, 15, 128);

      switch (id(oled_page)) {
        case 0:
          big(id(outdoor_temperature).state, "%.1f °C");
          row(49, "Feuchte", id(outdoor_humidity).state, "%.0f %%");
          break;
        case 1: {
          big(id(outdoor_wind_speed).state, "%.1f m/s");
          const float direction = id(outdoor_wind_direction).state;
          if (std::isnan(direction)) {
            it.print(0, 49, id(font_small), "--");
          } else {
            static const char *const COMPASS[] = {"N", "NO", "O", "SO", "S", "SW", "W", "NW"};
            const int sector = static_cast<int>((direction + 22.5f) / 45.0f) % 8;
            it.printf(0, 49, id(font_small), "%s %.0f°", COMPASS[sector], direction);
          }
          const float gust = id(outdoor_wind_gust).state;
          if (std::isnan(gust)) {
            it.print(127, 49, id(font_small), TextAlign::TOP_RIGHT, "Böe --");
          } else {
            it.printf(127, 49, id(font_small), TextAlign::TOP_RIGHT, "Böe %.1f", gust);
          }
          break;
        }
        case 2:
          row(17, "Regen", id(outdoor_rain).state, "%.1f mm");
          row(33, "UV-Index", id(outdoor_uv).state, "%.1f");
          row(49, "Licht", id(outdoor_illuminance).state, "%.0f lx");
          break;
        case 3:
          row(17, "Temperatur", id(neighbor_temperature).state, "%.1f °C");
          row(33, "Feuchte", id(neighbor_humidity).state, "%.0f %%");
          row(49, "Wind", id(neighbor_wind_speed).state, "%.1f m/s");
          break;
        default:
          row(17, "Funk", id(outdoor_rssi).state, "%.0f dBm");
          row(33, "WLAN", id(wlan_signal).state, "%.0f dBm");
          it.print(0, 49, id(font_small), "Batterie");
          it.print(127, 49, id(font_small), TextAlign::TOP_RIGHT,
                   !id(outdoor_battery_low).has_state() ? "--"
                   : id(outdoor_battery_low).state      ? "schwach"
                                                        : "OK");
          break;
      }

interval:
  - interval: 5s
    then:
      - lambda: id(oled_page) = (id(oled_page) + 1) % 5;
      - component.update: oled
